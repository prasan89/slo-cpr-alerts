[project]
name = "slo-cpr-alerts"
version = "0.2.0"
description = "Five-minute CPR monitoring and Excel alerting for NIFTY, BANKNIFTY and NSE F&O stocks"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "openpyxl>=3.1", "requests>=2.31", "growwapi>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slo-cpr = "slo_cpr_alerts.app:main"
