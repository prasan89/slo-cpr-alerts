[project]
name = "slo-cpr-alerts"
version = "0.4.0"
description = "Five-minute CPR and JFT monitoring with volume-confirmed alerts for NSE symbols"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "openpyxl>=3.1", "requests>=2.31", "growwapi>=1.5", "fyers-apiv3>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slo-cpr = "slo_cpr_alerts.app:main"
fyers-auth = "slo_cpr_alerts.fyers_auth:main"
scan-today = "slo_cpr_alerts.scan_today:main"
slo-jft = "slo_cpr_alerts.jft_cli:main"
